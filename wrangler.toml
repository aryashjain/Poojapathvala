name = "poojapathvala"
main = "src/index.js"
compatibility_date = "2025-01-01"

# Custom domains. Both must be zones on this Cloudflare account.
[[routes]]
pattern = "poojapathvala.in"
custom_domain = true

[[routes]]
pattern = "www.poojapathvala.in"
custom_domain = true

# Static files (logo, favicon, touch icon, social image) are served from public/.
[assets]
directory = "./public"

# Texts added through /admin are stored here. Create it once with:
#   npx wrangler kv namespace create LIBRARY
# then paste the printed id below.
[[kv_namespaces]]
binding = "LIBRARY"
id = "d89648deeebf4ffaa8affd5c3fb9da14"

# PostHog analytics. The project token is public: it is meant to be sent to the browser.
[vars]
POSTHOG_HOST = "https://us.i.posthog.com"
POSTHOG_PROJECT_TOKEN = "phc_AQFLAgnpNbX5oEK6c5XyzMbeMBqqK9Wct5e2895geo7o"
